<script>
const E=(x)=>Math.max(0,Math.min(1,x)); const ease=x=>{x=E(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2};
const S=[[0,3.2],[3.2,17],[17,22.5],[22.5,26.5]];
function show(id,t,a,z){const el=document.getElementById(id);let o=E((t-a)/0.25)*E((z-t)/0.25);el.style.opacity=o;}
function render(t){
 S.forEach((s,i)=>show('s'+i,t,s[0],s[1]));
 // cena 0
 document.getElementById('s0b').style.opacity=E((t-1.2)/0.3);
 const m0=document.getElementById('m0'); m0.style.transform=`translateY(${Math.sin(t*6)*12}px) scale(${1+0.06*Math.sin(t*10)})`;
 // cena 1
 const p=t-3.2; const mv=ease((p-7)/1.6);
 const t1=document.getElementById('s1t');
 if(p<7){t1.innerHTML='<span class="rd">✖ ERRADO</span><br>cabo na placa-mãe';} else {t1.innerHTML='<span class="gr">✔ CERTO</span><br>cabo na placa de vídeo';}
 const sx=400,sy=-60; const ax=265,ay=277, bx=510,by=595;
 const ex=ax+(bx-ax)*mv, ey=ay+(by-ay)*mv;
 const enter=ease(p/1.2); const cy=sy+(ey-sy)*Math.min(1,enter*1.0+ (p>1.2?1:0)*0);
 const px=sx+(ex-sx)*enter, py=sy+(ey-sy)*enter;
 document.getElementById('cable').setAttribute('d',`M ${sx} ${sy} C ${sx} ${sy+200}, ${px+150} ${py-150}, ${px+35} ${py}`);
 const plug=document.getElementById('plug'); plug.setAttribute('x',px-0); plug.setAttribute('y',py-20);
 document.getElementById('mbport').setAttribute('stroke-width', p<7?4+2*Math.sin(t*12):0);
 document.getElementById('gpuport').setAttribute('stroke-width', p>8.6?6:0);
 const mk=document.getElementById('mark');
 if(p>1.3&&p<7){mk.innerHTML=`<g transform="translate(110,250)" opacity="${E((p-1.3)/0.3)}"><circle r="46" fill="#ff3c5a"/><path d="M-18 -18 L18 18 M18 -18 L-18 18" stroke="#fff" stroke-width="10" stroke-linecap="round"/></g>`;}
 else if(p>8.8){mk.innerHTML=`<g transform="translate(700,600)" opacity="${E((p-8.8)/0.3)}"><circle r="46" fill="#22ee8c"/><path d="M-20 0 L-5 16 L22 -16" stroke="#07040f" stroke-width="10" fill="none" stroke-linecap="round"/></g>`;}
 else mk.innerHTML='';
 const bar=document.getElementById('bar'), bt=document.getElementById('bart');
 if(p<8.8){bar.style.width=(10+3*Math.sin(t*9))+'%';bar.style.background='#ff3c5a';bt.innerHTML='<span class="rd">Travando 😩</span>';}
 else {const g=ease((p-8.8)/1.5);bar.style.width=(10+85*g)+'%';bar.style.background='linear-gradient(90deg,#8b5cff,#22ee8c)';bt.innerHTML='<span class="gr">Agora sim! 🔥</span>';}
}
</script></body></html>
